[[quest]]
name = "enums2"
chapter = 10
path = "10_enums_match/enums2.rs"
title = "Exhaustive match"
summary = "An order status state machine."
hint = """
1. next is a match on s with one arm per variant. Return Some with the following status, or None where there is no next step.
2. cancel can put the cancellable variants in one arm with |, and return Some(Cancelled) from it. Shipped and Delivered share the other arm, and return None.
3. Put Cancelled in the same arm as Pending and Paid, so cancelling a cancelled order gives Some. Leave out a _ arm so the compiler checks every variant.
"""

[[quest]]
name = "option1"
chapter = 10
path = "10_enums_match/option1.rs"
title = "Option instead of null"
summary = "Return None when there is nothing to return."
hint = """
1. find_user: loop over the list with `for (user_id, name) in users`. When
   `*user_id == id`, return `Some(name.as_str())`. If the loop ends with no match, return None.
2. safe_divide: look for an integer method that returns an Option instead of
   panicking, such as checked_div. It returns None for a zero divisor and for i32::MIN / -1.
3. first_even: loop over v with `for x in v`. Each x is a reference, so `x % 2`
   works and `*x` is the number to return. Return `Some(*x)` at the first even
   value, and None after the loop.
"""

[[quest]]
name = "option2"

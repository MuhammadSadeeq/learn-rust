path = "06_ownership/move2.rs"
title = "Ownership in, ownership out"
summary = "Take a String, change it, hand it back."
hint = """
1. The function owns the String it receives, so it can change it in place. It doesn't need to build a new one.
2. String has push_str, which appends a &str to the end of the String.
3. Call push_str with the signature text, then end the function with text and no semicolon, so ownership goes back to the caller.
"""

[[quest]]
name = "move3"
chapter = 6
path = "06_ownership/move3.rs"
title = "Copy or move?"
summary = "Know which values are copied and which are moved."
hint = """
1. The compiler reports E0382 twice. Each message names a variable that was used after a line that moved it.
2. For each one you can move the use above the line that moves the value, or borrow the value with & where the function only reads it.
3. describe takes &name, so call it before `let archived = name;`. For the Vec, iter() only borrows it, so compute the total before `let graded = scores;`.
"""

[[quest]]
name = "move4"
chapter = 6
path = "06_ownership/move4.rs"
title = "Loops consume"
summary = "Iterate a Vec without giving it away."
hint = """
1. Read the error on the words.len() line. The loop before it took the Vec, so the Vec is gone when that line runs.
2. A for loop over a Vec takes it by value. A for loop over a reference borrows it instead.
3. Change the loop header to `for w in &words`. Then w is a &String, and w.len() works the same way.
"""

[[quest]]
name = "borrow1"
chapter = 7
path = "07_borrowing/borrow1.rs"
title = "Look, don't take"
summary = "Pass references instead of moving values."
hint = """
1. Look at what each function does with its argument. If it only reads it, the parameter can be a borrow.
2. &str accepts both a &String and a literal. &[i32] accepts both a &Vec<i32> and an array. A String parameter takes the value away from the caller.
3. Change the two parameter types to &str and &[i32]. Then call word_count(&text) and sum(&scores) in main.
"""

[[quest]]
name = "borrow2"
chapter = 7
path = "07_borrowing/borrow2.rs"
title = "Mutable borrow"
summary = "Modify a value through &mut."
hint = """
1. A `&mut` parameter lets the function change the caller's value. `for price in prices` gives each price as a `&mut u32`, and `*price = ...` writes the new value back into the caller's slice.
2. Do the tax math in u64, because a price of one billion times 110 doesn't fit in u32. Integer division rounds the tax down. Cast the result back with `as u32`.
3. For wrap_in_stars, `insert(0, '*')` puts a character at the start of the String, and `push('*')` adds one at the end. Both change the String the caller owns.
"""

[[quest]]
name = "borrow3"
chapter = 7
path = "07_borrowing/borrow3.rs"
title = "Readers or a writer"
summary = "Untangle overlapping shared and mutable borrows."
hint = """
1. Each error names a borrow that is still alive. E0502 is the reference `&v[0]` that push_and_report keeps while it pushes. E0499 is two `&mut` borrows of elements of the same slice, alive at the same time.
2. Copy the first value out with `v[0]`. An i32 is Copy, so the copy is a plain number, and no borrow of v remains when you push. An empty Vec has no first value, so check `is_empty()` before you index.
3. For swap_first_two, slices have a `swap` method. It exchanges two places with a single `&mut` borrow of the slice, so no two element borrows overlap.
"""

[[quest]]
name = "borrow4"
chapter = 7
path = "07_borrowing/borrow4.rs"
title = "No dangling"
summary = "Return owned data instead of a reference to a local."
hint = """
1. E0515 means the returned reference would point at greeting, which is dropped when make_greeting returns.
2. A function can return an owned value. The caller then owns it, and it lives as long as the caller needs it.
3. Change the return type to String, and return the format! result without the &.
"""

[[quest]]
name = "strings1"
chapter = 8
path = "08_strings_slices/strings1.rs"
title = "String or &str"
summary = "Convert between owned and borrowed text."
hint = """
1. to_uppercase returns a new String. starts_with only checks a prefix and needs no allocation.
2. &str parameters accept both a &String and a literal. A String is only needed when a function returns new text.
3. Slices of &str have join(" ") for the words. For the prefix, s.starts_with("Hello") is case sensitive, which is what the tests expect.
"""

[[quest]]
name = "strings2"
chapter = 8
path = "08_strings_slices/strings2.rs"
title = "First word"
summary = "Return a slice into the input."
hint = """
1. `trim_matches(' ')` removes spaces at both ends. Then `find(' ')` returns an Option with the byte index of the first space. `match` on it: `Some(end)` gives `&s[..end]`, and `None` means the text is one word.
2. `rfind(' ')` finds the last space. The last word starts one byte after that space. With no space, the last word is the whole text.
3. Use `match` on the result of `rfind`, the same way: `Some(space) => &s[space + 1..]` and `None => s`. The "Option in one minute" section in Chapter 4 explains Some and None.
"""

[[quest]]
name = "strings3"
chapter = 8
path = "08_strings_slices/strings3.rs"
title = "Characters, not bytes"
summary = "Handle UTF-8 text correctly."
hint = """
1. len() counts bytes. chars() walks whole characters. "héllo" is 6 bytes and 5 characters, so count characters with a loop over `s.chars()`.
2. `insert(0, c)` puts a character at the front of a String. Walk the characters in order and insert each one at 0, and the string comes out reversed.
3. char_indices() gives each character with its byte position. In truncate_chars, count the characters as you go. At the first character after `max`, return the slice up to its byte position. If the loop ends, the whole string fits.
"""

[[quest]]
name = "strings4"
chapter = 8
path = "08_strings_slices/strings4.rs"
title = "Building strings"
summary = "Title-case words and build a URL slug."
hint = """
1. split_whitespace() splits on any run of spaces. Push each word's characters into a String, with one space between words.
2. char_indices() gives each character with its position. For the first character (position 0), to_uppercase() can give more than one char, so loop over it and push each one. Push the other characters as they are.
3. For slugify, loop over the chars. Keep each ASCII letter or digit, lowercased with to_ascii_lowercase(). For anything else, push one '-' unless the last char already is one. At the end, trim_matches('-') removes dashes at both ends.
"""

[[quest]]
name = "boss2_text_stats"
chapter = 8
path = "08_strings_slices/boss2_text_stats.rs"
title = "Text statistics"
summary = "Act II boss: analyze text without a single unnecessary clone."
boss = true
hint = """
1. Start with the loops. `for word in text.split_whitespace()` visits each word as a &str slice, so nothing is copied. Count with `let mut count = 0;` and `count += 1;`.
2. A char is not a byte. `chars()` visits characters, and `len()` counts bytes. For longest_word, keep the best word and its character count, and replace them only for a strictly longer word. average_word_len divides with `as f64`.
3. For non_ascii_words, `bytes()` visits the raw bytes, and every byte of a non-ASCII character is above 127. For first_sentence, `char_indices()` gives each character with its byte position. The end marks are one byte long, so `&text[..i + 1]` ends right after one.
"""


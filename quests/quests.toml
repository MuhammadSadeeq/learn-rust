hint = """
1. Write one match per function, with one arm for each variant. Name the fields in the pattern, as in Notification::Email { to, subject }.
2. Build the text with format!, for example format!("Push: {title}"). Silent gives String::new().
3. channel does not need the field values, so the patterns can skip them with .. or _, as in Notification::Email { .. } => "email".

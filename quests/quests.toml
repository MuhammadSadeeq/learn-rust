# Oxidize Forge: the quest list.
#
# The order of this file is the order you play the quests in.
# `cargo forge` reads it, `tools/sync-quests.mjs` copies it into the website.
#
# Fields: name (also the cargo bin name), chapter, path (relative to quests/),
# title, summary, boss (optional), hint (multi-line string).

[[quest]]
name = "hello1"
chapter = 1
path = "01_hello/hello1.rs"
title = "First words"
summary = "Make the program compile and greet the world."
hint = """
1. Read the first error. It says Rust expected a function and found a macro.
2. Macros are called with a `!` after their name, such as `vec!` or `format!`.
3. Add the `!` right after `println`, the way `println!` is written. That leaves one more error: `println!` needs a format string before the value, as in `println!("{}", greeting());`.
"""

[[quest]]
name = "hello2"
chapter = 1
path = "01_hello/hello2.rs"
title = "Formatting"
summary = "Build strings with format! and inline arguments."
hint = """
1. `format!` takes the same kind of template as `println!`. Return its result
   instead of printing it.
2. Any variable in scope can go inside the braces: `format!("Hi {name}")`. For
   the cents, `/` gives the whole dollars and `%` gives the leftover cents.
3. `{rest:02}` pads a number to a width of two with zeros, so 5 prints as 05.
   Chapter 1's `{:>8}` also sets a width, and `0` is the fill.
"""

[[quest]]
name = "vars1"
chapter = 2
path = "02_variables/vars1.rs"
title = "Mutable on purpose"
summary = "Decide which bindings really need mut."
hint = """
1. The error names the variable that is assigned twice: `total`. Which bindings
   in Rust can change after they are created?
2. Bindings are immutable by default. `mut` makes one changeable. Put it on the
   binding that changes, and only on that one.
3. The warning points at `label`. Remove the `mut` there, so every `mut` you
   keep means something.
"""

[[quest]]
name = "vars2"
chapter = 2
path = "02_variables/vars2.rs"
title = "Shadowing"
summary = "Reuse a name for a value of a different type."
hint = """
1. The error points at the assignment. Compare the type `number` started with
   against the type of the value being put into it.
2. An assignment has to keep the variable's type. A new `let` with the same
   name creates a fresh variable, and that one can have a new type.
3. Turn the assignment into a `let`, and drop the `mut` that the line no longer
   needs.
"""

[[quest]]
name = "vars3"
chapter = 2
path = "02_variables/vars3.rs"
title = "Constants"
summary = "Declare constants with explicit types."
hint = """
1. Read the first error. It says a const is missing its type. Compare the first
   line with the other two.
2. A const needs `: Type` between its name and the `=`, the same way the other
   two lines have it.
3. The other two use `u64`, so give the first one the same type.
"""

[[quest]]
name = "types1"
chapter = 3
path = "03_types/types1.rs"
title = "Pick the right integer"
summary = "Choose integer types that fit the data and don't overflow."
hint = """
1. The panic message says "attempt to add with overflow". Which variable is
   growing past its limit, and what type is it?
2. A u8 holds at most 255. Choose a wider integer type for `total`, and convert
   each age into it with `u32::from(age)`. That works because every u8 fits in a u32.
3. Divide the wide total by the count, then cast the result back to u8 with
   `as u8`. The average of u8 values always fits in a u8.
"""

[[quest]]
name = "types2"
chapter = 3
path = "03_types/types2.rs"
title = "Tuples"
summary = "Return several values at once and destructure them."
hint = """
1. A tuple is written in parentheses. A function returns its last expression,
   so ending with `(low, high)` hands back both values.
2. Start `low` and `high` from `v[0]`, the first value. Then compare each value
   in the loop and update either one when you see a smaller or larger value.
   Indexing a slice works the same way as indexing an array.
3. `let (a, b) = pair;` takes a tuple apart. Build the reversed tuple from those
   two names.
"""

[[quest]]
name = "types3"
chapter = 3
path = "03_types/types3.rs"
title = "Arrays"
summary = "Fixed-size arrays, indexing and length."
hint = """
1. `[u32; 7]` always holds seven values. Index them from 0, with `days[0]`
   through `days[6]`.
2. For the total, the loop is already written. Start the total at 0, with the
   type the function returns.
3. For the busiest day, start with day 0 and its hours from `days[0]`. The loop
   replaces both only for a strictly larger value, which keeps the earlier day on a tie.
"""

[[quest]]
name = "types4"
chapter = 3
path = "03_types/types4.rs"
title = "Casting with as"
summary = "Convert between numeric types explicitly."
hint = """
1. `as` never fails at run time, but it can wrap. `300i32 as u8` compiles and
   gives 44. A plain `300 as u8` does not compile, because the literal is
   checked against u8. Decide what an out-of-range value should mean before you cast.
2. `x.clamp(0, 255)` limits x to the range first, so the `as u8` after it cannot
   wrap. For `low_byte`, a plain `as u8` keeps the low eight bits.
3. For `truncate`, a plain `as i64` already does the job. It drops the fraction
   toward zero and saturates at the limits of i64.
"""

[[quest]]
name = "functions1"
chapter = 4
path = "04_control_flow/functions1.rs"
title = "Return values"
summary = "Fix signatures and the semicolon that swallows a return value."
hint = """
1. The compiler reports each function separately. Fix one error, run cargo
   forge again, and the next error will show up.
2. A block's value is its last line, but only when that line has no semicolon.
3. Every parameter needs `name: Type`, and a function that returns a value needs
   `-> Type` after its parameter list.
"""

[[quest]]
name = "control1"
chapter = 4
path = "04_control_flow/control1.rs"
title = "if is an expression"
summary = "Use if/else to produce a value."
hint = """
1. An `if` produces a value, so the chain can be the function's last expression.
   Don't add `return`, and don't put a semicolon after the chain.
2. Test the highest band first. The first condition that is true wins, so
   `score >= 90` already covers everything above 90.
3. For `abs_diff`, subtract the smaller number from the larger one. An `if` can
   decide which subtraction to run.
"""

[[quest]]
name = "control2"
chapter = 4
path = "04_control_flow/control2.rs"
title = "loop returns a value"
summary = "Break out of a loop with a result."
hint = """
1. `loop` runs until it reaches a `break`. `break candidate;` ends the loop and
   makes `candidate` the value of the whole loop.
2. Try each number in turn, starting at `start`. If it divides evenly by `by`,
   break with it. If not, add one and go around again.
3. For the Collatz count, `while n != 1` keeps going until the sequence reaches
   1. On each pass, pick the next number with an `if` and add one to the count.
"""

[[quest]]
name = "control3"
chapter = 4
path = "04_control_flow/control3.rs"
title = "FizzBuzz, the Rust way"
summary = "Ranges, for loops and a match on a tuple."
hint = """
1. A `match` can take a tuple, so `match (n % 3, n % 5)` looks at both
   remainders together.
2. Arms are checked from the top, and `_` matches anything. Put the arm for
   numbers that divide by both 3 and 5 first, because 15 also matches the Fizz arm.
3. `for i in 1..=n` includes `n`. Start with `let mut lines = Vec::new();`, push
   `fizzbuzz(i)` on each pass, and return `lines` at the end.
"""

[[quest]]
name = "boss1_receipt"
chapter = 4
path = "04_control_flow/boss1_receipt.rs"
title = "Print a receipt"
summary = "Act I boss: totals, tax and aligned columns."
boss = true
hint = """
1. Build from the bottom up. `line_total` and `subtotal` come first, and each
   later function calls the earlier ones. In `subtotal`, `for (_, qty, unit_cents)
   in items` gives references, so read the numbers with `*qty` and `*unit_cents`.
2. In `tax`, do the multiplication in u64, add half of 10000, and divide by 10000
   to round half up. `format_money` is written for you. Read it and move on.
3. In `render`, start with `let mut text = String::new();`. For each item,
   `text.push_str(&format!("{name:<16}{qty:>3}{price:>10}\n"))` adds one row and
   its newline. The three summary rows use `{:<19}{:>10}` the same way.
"""

[[quest]]
name = "memory1"
chapter = 5
path = "05_memory/memory1.rs"
title = "Size it up"
summary = "Predict how many bytes common types take on the stack."
hint = """
1. Size means bytes on the stack. Heap contents don't count. Start with the types you know from the chapter 05 table, then reason about the rest.
2. A reference or a Box is one pointer, 8 bytes on a 64-bit machine. A String or a Vec is three words. A &str is a pointer and a length.
3. An i32 must start at a multiple of 4, so (i32, u8) rounds up to 8. A Box can't be null, so Option<Box<i32>> can use the null pointer for None and needs no extra tag.
"""

[[quest]]
name = "memory2"
chapter = 5
path = "05_memory/memory2.rs"
title = "Length vs capacity"
summary = "Watch a Vec's capacity grow and size a String once."
hint = """
1. with_capacity(n) reserves room for n bytes without putting any text in the String. First work out the exact byte count of the finished line.
2. needed_capacity adds the length of every field, then one comma for each gap between two neighbors. fields.len().saturating_sub(1) counts the gaps, and it is 0 for an empty list.
3. In grow_report, remember the capacity before the loop. After each push, compare the new capacity with the remembered one, and record it only when it changed.
"""

[[quest]]
name = "move1"
chapter = 6
path = "06_ownership/move1.rs"
title = "Use after move"
summary = "Fix the classic E0382 without cloning."
hint = """
1. Read the error from the bottom up: which line uses `names` after it was moved?
2. `let all = names;` moves the vector into `all`. Anything you need from `names`
   has to happen before that line.
3. Swap the two `let` lines, or drop `all` and use `names` directly.
"""

[[quest]]
name = "move2"

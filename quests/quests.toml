hint = """
1. Start with `Queue::new`. Create the channel, wrap the receiver in `Arc::new(Mutex::new(..))`, and spawn one thread per worker with `thread::spawn(move || worker_loop(..))`, giving each thread its own `Arc` clones. Store the sender as `Some(sender)` and keep the join handles in `workers`.

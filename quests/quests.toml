# Oxidize Forge: the quest list.
#
# The order of this file is the order you play the quests in.
# `cargo forge` reads it, `tools/sync-quests.mjs` copies it into the website.
#
# Fields: name (also the cargo bin name), chapter, path (relative to quests/),
# title, summary, boss (optional), hint (multi-line string).

[[quest]]
name = "hello1"
chapter = 1
path = "01_hello/hello1.rs"
title = "First words"
summary = "Make the program compile and greet the world."
hint = """
1. Read the first error. It says Rust expected a function and found a macro.
2. Macros are called with a `!` after their name, such as `vec!` or `format!`.
3. Add the `!` right after `println`, the way `println!` is written.
"""

[[quest]]
name = "hello2"
chapter = 1
path = "01_hello/hello2.rs"
title = "Formatting"
summary = "Build strings with format! and inline arguments."
hint = """
1. `format!` takes the same kind of template as `println!`. Return its result
   instead of printing it.
2. Any variable in scope can go inside the braces: `format!("Hi {name}")`. For
   the cents, `/` gives the whole dollars and `%` gives the leftover cents.
3. `{rest:02}` pads a number to two digits with leading zeros, so use it on the
   cents to make 5 print as 05.
"""

[[quest]]
name = "vars1"
chapter = 2
path = "02_variables/vars1.rs"
title = "Mutable on purpose"
summary = "Decide which bindings really need mut."
hint = """
1. The error names the variable that is assigned twice: `total`. Which bindings
   in Rust can change after they are created?
2. Bindings are immutable by default. `mut` makes one changeable. Put it on the
   binding that changes, and only on that one.
3. The warning points at `label`. Remove the `mut` there, so every `mut` you
   keep means something.
"""

[[quest]]
name = "vars2"
chapter = 2
path = "02_variables/vars2.rs"
title = "Shadowing"
summary = "Reuse a name for a value of a different type."
hint = """
1. The error points at the assignment. Compare the type `number` started with
   against the type of the value being put into it.
2. An assignment has to keep the variable's type. A new `let` with the same
   name creates a fresh variable, and that one can have a new type.
3. Turn the assignment into a `let`, and drop the `mut` that the line no longer
   needs.
"""

[[quest]]
name = "vars3"
chapter = 2
path = "02_variables/vars3.rs"
title = "Constants"
summary = "Declare constants with explicit types."
hint = """
1. Read the first error. It says a const is missing its type. Compare the first
   line with the other two.
2. A const needs `: Type` between its name and the `=`, the same way the other
   two lines have it.
3. The other two use `u64`, so give the first one the same type.
"""

[[quest]]
name = "types1"
chapter = 3
path = "03_types/types1.rs"
title = "Pick the right integer"
summary = "Choose integer types that fit the data and don't overflow."
hint = """
1. The panic message says "attempt to add with overflow". Which variable is
   growing past its limit, and what type is it?
2. A u8 holds at most 255. Choose a wider integer type for the running total,
   and convert each age into it with `u32::from`.
3. Return 0 early for an empty list. Otherwise total in the wider type, divide
   by the count, and cast the result back to u8.
"""

[[quest]]
name = "types2"
chapter = 3
path = "03_types/types2.rs"
title = "Tuples"
summary = "Return several values at once and destructure them."
hint = """
1. A tuple is written in parentheses. A function returns its last expression,
   so ending with `(low, high)` hands back both values.
2. Start `low` and `high` from the first value. Then go through the rest and
   update either one when you see a smaller or larger value.
3. `let (a, b) = pair;` takes a tuple apart. Build the reversed tuple from those
   two names.
"""

[[quest]]
name = "types3"
chapter = 3
path = "03_types/types3.rs"
title = "Arrays"
summary = "Fixed-size arrays, indexing and length."
hint = """
1. `[u32; 7]` always holds seven values. Index them from 0, with `days[0]`
   through `days[6]`.
2. For the total, start a counter at 0 and add each day. A `for day in days`
   loop visits every value.
3. For the busiest day, remember the best day and its hours so far. Replace both
   only for a strictly larger value, which keeps the earlier day on a tie.
"""

[[quest]]
name = "types4"
chapter = 3
path = "03_types/types4.rs"
title = "Casting with as"
summary = "Convert between numeric types explicitly."
hint = """
1. `300 as u8` compiles and gives 44, with no error at all. Decide what an
   out-of-range value should mean before you cast.
2. `u8::try_from(x)` gives back a Result. The `.ok()` method turns an Ok into
   Some and an Err into None.
3. Limit the value with `x.clamp(0, 255)` before the cast. For `truncate`, a
   plain `as` already does the job.
"""

[[quest]]
name = "functions1"
chapter = 4
path = "04_control_flow/functions1.rs"
title = "Return values"
summary = "Fix signatures and the semicolon that swallows a return value."
hint = """
1. The compiler reports each function separately. Fix one error, run cargo
   forge again, and the next error will show up.
2. A block's value is its last line, but only when that line has no semicolon.
3. Every parameter needs `name: Type`, and a function that returns a value needs
   `-> Type` after its parameter list.
"""

[[quest]]
name = "control1"
chapter = 4
path = "04_control_flow/control1.rs"
title = "if is an expression"
summary = "Use if/else to produce a value."
hint = """
1. An `if` produces a value, so the chain can be the function's last expression.
   Don't add `return`, and don't put a semicolon after the chain.
2. Test the highest band first. The first condition that is true wins, so
   `score >= 90` already covers everything above 90.
3. For `abs_diff`, subtract the smaller number from the larger one. An `if` can
   decide which subtraction to run.
"""

[[quest]]
name = "control2"
chapter = 4
path = "04_control_flow/control2.rs"
title = "loop returns a value"
summary = "Break out of a loop with a result."
hint = """
1. `loop` runs until it reaches a `break`. `break candidate;` ends the loop and
   makes `candidate` the value of the whole loop.
2. Try each number in turn, starting at `start`. If it divides evenly by `by`,
   break with it. If not, add one and go around again.
3. For the Collatz count, `while n != 1` keeps going until the sequence reaches
   1. On each pass, pick the next number with an `if` and add one to the count.
"""

[[quest]]
name = "control3"
chapter = 4
path = "04_control_flow/control3.rs"
title = "FizzBuzz, the Rust way"
summary = "Ranges, for loops and a match on a tuple."
hint = """
1. A `match` can take a tuple, so `match (n % 3, n % 5)` looks at both
   remainders together.
2. Arms are checked from the top, and `_` matches anything. Put the arm for
   numbers that divide by both 3 and 5 first, because 15 also matches the Fizz arm.
3. `for i in 1..=n` includes `n`. Start with `let mut lines = Vec::new();`, push
   `fizzbuzz(i)` on each pass, and return `lines` at the end.
"""

[[quest]]
name = "boss1_receipt"
chapter = 4
path = "04_control_flow/boss1_receipt.rs"
title = "Print a receipt"
summary = "Act I boss: totals, tax and aligned columns."
boss = true
hint = """
1. Build from the bottom up. `line_total` and `subtotal` come first, and each
   later function calls the earlier ones, so get those right before you move on.
2. In `format_money`, work in whole dollars and leftover cents. Count the dollar
   digits from the right to find where commas go, and put one before each group
   of three, except at the start.
3. In `render`, format each item row with `{name:<16}{qty:>3}{price:>10}`. Pad
   the summary labels to 19 so their prices line up with the item prices, and
   join the rows with a newline.
"""

[[quest]]
name = "memory1"
chapter = 5
path = "05_memory/memory1.rs"
title = "Size it up"
summary = "Predict how many bytes common types take on the stack."
hint = """
1. Size means bytes on the stack. Heap contents don't count. Start with the types you know from the chapter 05 table, then reason about the rest.
2. A reference or a Box is one pointer, 8 bytes on a 64-bit machine. A String or a Vec is three words. A &str is a pointer and a length.
3. An i32 must start at a multiple of 4, so (i32, u8) rounds up to 8. A Box can't be null, so Option<Box<i32>> can use the null pointer for None and needs no extra tag.
"""

[[quest]]
name = "memory2"
chapter = 5
path = "05_memory/memory2.rs"
title = "Length vs capacity"
summary = "Watch a String's heap buffer grow."
hint = """
1. with_capacity(n) reserves room for n bytes without putting any text in the String. First work out the exact byte count of the finished line.
2. needed_capacity adds the length of every field, then one comma for each gap between two neighbors. fields.len().saturating_sub(1) counts the gaps, and it is 0 for an empty list.
3. In grow_report, remember the capacity before the loop. After each push, compare the new capacity with the remembered one, and record it only when it changed.
"""

[[quest]]
name = "move1"
chapter = 6
path = "06_ownership/move1.rs"
title = "Use after move"
summary = "Fix the classic E0382 without cloning."
hint = """
1. Read the error from the bottom up: which line uses `names` after it was moved?
2. `let all = names;` moves the vector into `all`. Anything you need from `names`
   has to happen before that line.
3. Swap the two `let` lines, or drop `all` and use `names` directly.
"""

[[quest]]
name = "move2"
chapter = 6
path = "06_ownership/move2.rs"
title = "Ownership in, ownership out"
summary = "Take a String, change it, hand it back."
hint = """
1. The function owns the String it receives, so it can change it in place. It doesn't need to build a new one.
2. String has push_str, which appends a &str to the end of the String.
3. Call push_str with the signature text, then end the function with text and no semicolon, so ownership goes back to the caller.
"""

[[quest]]
name = "move3"
chapter = 6
path = "06_ownership/move3.rs"
title = "Copy or move?"
summary = "Know which values are copied and which are moved."
hint = """
1. The compiler reports E0382 twice. Each message names a variable that was used after a line that moved it.
2. For each one you can move the use above the line that moves the value, or borrow the value with & where the function only reads it.
3. describe takes &name, so call it before `let archived = name;`. For the Vec, iter() only borrows it, so compute the total before `let graded = scores;`.
"""

[[quest]]
name = "move4"
chapter = 6
path = "06_ownership/move4.rs"
title = "Loops consume"
summary = "Iterate a Vec without giving it away."
hint = """
1. Read the error on the words.len() line. The loop before it took the Vec, so the Vec is gone when that line runs.
2. A for loop over a Vec takes it by value. A for loop over a reference borrows it instead.
3. Change the loop header to `for w in &words`. Then w is a &String, and w.len() works the same way.
"""

[[quest]]
name = "borrow1"
chapter = 7
path = "07_borrowing/borrow1.rs"
title = "Look, don't take"
summary = "Pass references instead of moving values."
hint = """
1. Look at what each function does with its argument. If it only reads it, the parameter can be a borrow.
2. &str accepts both a &String and a literal. &[i32] accepts both a &Vec<i32> and an array. A String parameter takes the value away from the caller.
3. Change the two parameter types to &str and &[i32]. Then call word_count(&text) and sum(&scores) in main.
"""

[[quest]]
name = "borrow2"
chapter = 7
path = "07_borrowing/borrow2.rs"
title = "Mutable borrow"
summary = "Modify a value through &mut."
hint = """
1. A &mut parameter lets the function change the caller's value. Assign through it with *price = ..., where the * reaches the number the reference points to.
2. Iterating a &mut [u32] with `for price in prices` gives you &mut u32 values. Do the multiplication in u64, because a price of one billion times 110 doesn't fit in u32. Integer division rounds the tax down.
3. For capitalize_first, s.chars().next() gives the first character. Replace exactly its bytes with s.replace_range, using len_utf8 to find how many bytes it takes.
"""

[[quest]]
name = "borrow3"
chapter = 7
path = "07_borrowing/borrow3.rs"
title = "Readers or a writer"
summary = "Untangle overlapping shared and mutable borrows."
hint = """
1. Each error names a borrow that is still alive. E0502 is the shared reference that push_and_report keeps while it pushes. E0499 is two &mut references to elements of the same Vec.
2. v.first() returns an Option<&i32>, which is a reference into the Vec. Calling copied() turns it into an Option<i32>, a plain value that doesn't borrow the Vec.
3. For swap_first_two, one &mut borrow of the whole slice is allowed, and slices have a method that swaps two elements. Use that method.
"""

[[quest]]
name = "borrow4"
chapter = 7
path = "07_borrowing/borrow4.rs"
title = "No dangling"
summary = "Return owned data instead of a reference to a local."
hint = """
1. E0515 means the returned reference would point at greeting, which is dropped when make_greeting returns.
2. A function can return an owned value. The caller then owns it, and it lives as long as the caller needs it.
3. Change the return type to String, and return the format! result without the &.
"""

[[quest]]
name = "strings1"
chapter = 8
path = "08_strings_slices/strings1.rs"
title = "String or &str"
summary = "Convert between owned and borrowed text."
hint = """
1. to_uppercase returns a new String. starts_with only checks a prefix and needs no allocation.
2. &str parameters accept both a &String and a literal. A String is only needed when a function returns new text.
3. Slices of &str have join(" ") for the words. For the prefix, s.starts_with("Hello") is case sensitive, which is what the tests expect.
"""

[[quest]]
name = "strings2"
chapter = 8
path = "08_strings_slices/strings2.rs"
title = "First word"
summary = "Return a slice into the input."
hint = """
1. trim_matches(' ') removes spaces at both ends. Then find(' ') returns the byte index of the first space, and &s[..i] is a slice up to it.
2. rfind(' ') finds the last space. The last word starts one byte after that space. If there is no space, the last word starts at 0.
3. Apply map_or(0, |i| i + 1) to the result of rfind, then slice from that position to the end.
"""

[[quest]]
name = "strings3"
chapter = 8
path = "08_strings_slices/strings3.rs"
title = "Characters, not bytes"
summary = "Handle UTF-8 text correctly."
hint = """
1. len() counts bytes. chars() walks whole characters. "héllo" is 6 bytes and 5 characters, so count characters with chars().
2. char_indices() yields (byte position, char) pairs. nth(max) is the first character you drop, and its byte position is where the prefix must end.
3. reverse_chars can collect s.chars().rev() into a String. truncate_chars can match on char_indices().nth(max), slice up to the position it gives, and return s when it gives None.
"""

[[quest]]
name = "strings4"
chapter = 8
path = "08_strings_slices/strings4.rs"
title = "Building strings"
summary = "push_str, format! and title case."
hint = """
1. split_whitespace() splits on any run of spaces. Capitalize each word, then join the results with " ".
2. to_uppercase() on one char returns an iterator, because one char can become several. Chain the rest of the word onto it and collect into a String.
3. For slugify, loop over the chars. Keep each ASCII letter or digit, lowercased. For anything else, push one '-' unless the last char already is one. At the end, trim '-' from both ends.
"""

[[quest]]
name = "boss2_text_stats"
chapter = 8
path = "08_strings_slices/boss2_text_stats.rs"
title = "Text statistics"
summary = "Act II boss: analyze text without a single unnecessary clone."
boss = true
hint = """
1. Start with words(). It yields &str slices of the text, so each function can count, measure or compare words without copying them.
2. For longest_word, reduce keeps the earlier word on a tie if you replace the best only when the new word is strictly longer. For most_frequent, count with a HashMap<&str, usize> and entry(word).or_insert(0).
3. In most_frequent, max_by can compare the counts first, then compare the words in reverse with b.cmp(a), so the alphabetically first word wins ties. In average_word_len, one fold can collect the total characters and the word count together.
"""

[[quest]]
name = "structs1"
chapter = 9
path = "09_structs/structs1.rs"
title = "Define a struct"
summary = "Named fields, tuple structs and unit structs."
hint = """
1. rustc names the struct and the field in every error. Start with the first error, which says what a struct literal is missing.
2. A tuple struct has no field names. Its fields are read as p.0 and p.1, not p.x and p.y.
3. A new account starts out active, so the struct literal in new_user needs a value for active. In deactivate, the field is a bool, so a number will not do.
"""

[[quest]]
name = "structs2"
chapter = 9
path = "09_structs/structs2.rs"
title = "Methods and new()"
summary = "impl blocks, &self, &mut self and constructors."
hint = """
1. Read each signature. new and square have no self, so they are called as Rect::new and Rect::square. The other methods take &self or &mut self.
2. area multiplies the two fields. scale changes the fields, so it needs &mut self. Assign with self.w *= k and the same for h.
3. can_hold needs both comparisons to be true at once: self.w >= other.w && self.h >= other.h. square can call new with the size twice.
"""

[[quest]]
name = "structs3"

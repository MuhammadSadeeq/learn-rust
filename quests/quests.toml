"""

[[quest]]
name = "enums1"
chapter = 10
path = "10_enums_match/enums1.rs"
title = "Enums with data"
summary = "Model messages whose variants carry different data."
hint = """
1. Write one match per function, with one arm for each variant. Name the fields in the pattern, as in Notification::Email { to, subject }.
2. Build the text with format!, for example format!("Push: {title}"). Silent gives String::new().
3. channel does not need the field values, so the patterns can skip them with .. or _, as in Notification::Email { .. } => "email".
"""

[[quest]]
name = "enums2"
chapter = 10
path = "10_enums_match/enums2.rs"
title = "Exhaustive match"
summary = "A traffic light state machine."
hint = """
1. next is a match on s with one arm per variant. Return Some with the following status, or None where there is no next step.
2. cancel can put the cancellable variants in one arm with |. Shipped and Delivered each get their own arm and message.
3. Put Cancelled in the same arm as Pending and Paid, so cancelling a cancelled order is Ok. Leave out a _ arm so the compiler checks every variant.
"""

[[quest]]
name = "option1"
chapter = 10
path = "10_enums_match/option1.rs"
title = "Option instead of null"
summary = "Return None when there is nothing to return."
hint = """
1. find_user: iter() and find() give you the matching tuple inside an Option. Then map gets the name, and as_str() borrows it as a &str.
2. safe_divide: look for an integer method that returns an Option instead of panicking, such as checked_div.
3. first_even: iterate with copied(), then find the first value where n % 2 == 0.
"""

[[quest]]
name = "option2"
chapter = 10
path = "10_enums_match/option2.rs"
title = "if let and let else"
summary = "Unwrap optional values without unwrap()."
hint = """
1. Each unwrap() panics on None, or on a bad parse. Replace it with a way to handle the missing case: if let, let else or unwrap_or.
2. parse_port: parse() returns a Result. .ok() turns it into an Option, and unwrap_or(8080) gives the fallback.
3. initials: let Some(name) = name else { return String::new(); } handles the None case first. The iterator chain after it can stay as it is.
"""

[[quest]]
name = "errors1"
chapter = 11
path = "11_errors/errors1.rs"
title = "Return a Result"
summary = "Replace a panic with a recoverable error."
hint = """
1. A function that returns a Result should return Err for bad input, not call panic! or expect(). Each message in the header is one Err value.
2. Use match on s.parse::<u32>(). Put the error arm first, then a guard arm for numbers above 150.
3. The guard looks like Ok(n) if n > 150 => Err(String::from("too old")). The last arm is Ok(n) for a valid age.
"""

[[quest]]
name = "errors2"
chapter = 11
path = "11_errors/errors2.rs"
title = "The ? operator"
summary = "Propagate parse errors upward."
hint = """
1. unwrap() turns an error into a panic. These functions already return a Result, so the error can travel up to the caller instead.
2. Put ? after a call that returns a Result. On Err it returns that error from the function at once. On Ok it gives you the value.
3. In sum_csv, total += field.parse::<i64>()?; does it. In parse_point, each of the two parses gets its own ? inside the Ok(...).
"""

[[quest]]
name = "errors3"

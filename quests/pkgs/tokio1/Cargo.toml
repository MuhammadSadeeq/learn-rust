# A quest package: one crate, checked with `cargo test`.
# The empty [workspace] makes it its own workspace, so the course's root
# workspace leaves it alone.
[package]
name = "tokio1"
version = "0.1.0"
edition = "2024"
publish = false

[workspace]

[dependencies]
# test-util gives the tests a paused clock (`start_paused`), so the timeouts
# are exact and the tests run in no time at all.
tokio = { version = "1.53", features = ["full", "test-util"] }

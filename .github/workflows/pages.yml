name: Publish site

# Publishes site/ to GitHub Pages. Run it from the Actions tab.
# One-time setup: Settings → Pages → Build and deployment → Source: GitHub Actions.
# To publish on every push to main instead, add `push: { branches: [main] }`
# under `on:` once Pages is enabled.
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4

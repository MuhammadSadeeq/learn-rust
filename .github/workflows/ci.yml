name: CI

# Keeps the course honest: every Rust snippet on the site is compiled, every
# PHP sample parses on PHP 8.5, every quest must fail as shipped and pass with
# its solution, and the Forge itself must build cleanly.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  course:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.5"
          tools: none
          coverage: none
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target
            projects/notes-api -> target

      - name: Quest manifest is in sync with quests.toml
        run: |
          node tools/sync-quests.mjs
          git diff --exit-code -- quests/Cargo.toml site/assets/quests-data.js

      - name: Forge builds, passes its tests and clippy
        run: |
          cargo fmt -p forge -- --check
          cargo clippy -p forge --all-targets -- -D warnings
          cargo test -p forge

      - name: Cache the snippet crates (tools/snippet-crates)
        uses: actions/cache@v4
        with:
          path: target/snippet-crates/target
          key: snippet-crates-${{ runner.os }}-${{ hashFiles('tools/snippet-crates/Cargo.lock') }}
          restore-keys: snippet-crates-${{ runner.os }}-

      - name: Every snippet on the site compiles (or fails exactly as documented)
        run: node tools/check-snippets.mjs --crates

      - name: Every PHP sample parses on PHP 8.5 and uses modern idioms
        run: node tools/check-php.mjs

      - name: Cache the cargo quests' builds (target/forge-pkgs)
        uses: actions/cache@v4
        with:
          path: target/forge-pkgs
          key: forge-pkgs-${{ runner.os }}-${{ hashFiles('quests/pkgs/**/Cargo.lock') }}
          restore-keys: forge-pkgs-${{ runner.os }}-

      - name: Every quest fails as shipped and passes with its solution
        run: node tools/check-quests.mjs

      - name: Companion project (notes-api) builds and passes its tests
        if: hashFiles('projects/notes-api/Cargo.toml') != ''
        run: cargo test --manifest-path projects/notes-api/Cargo.toml

      - name: Agent harness (projects/tool-runner) is formatted
        if: hashFiles('projects/tool-runner/Cargo.toml') != ''
        run: cargo fmt --manifest-path projects/tool-runner/Cargo.toml -- --check

      - name: Agent harness (projects/tool-runner) is clippy-clean
        if: hashFiles('projects/tool-runner/Cargo.toml') != ''
        run: cargo clippy --manifest-path projects/tool-runner/Cargo.toml --all-targets -- -D warnings

      - name: Agent harness (projects/tool-runner) passes its tests
        if: hashFiles('projects/tool-runner/Cargo.toml') != ''
        run: cargo test --manifest-path projects/tool-runner/Cargo.toml

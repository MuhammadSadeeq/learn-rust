# Oxidize workspace.
#   forge   the quest trainer (`cargo forge`)
#   quests  your exercises; every quest is its own binary so one broken file
#           never blocks the others, and rust-analyzer checks each one live.
#           quests/pkgs/* are small cargo packages (kind = "cargo"); each has
#           its own empty [workspace], so they stay out of this workspace.
[workspace]
members = ["forge", "quests"]
default-members = ["forge"]
exclude = ["projects", "solutions", "quests/pkgs", "solutions/pkgs"]
resolver = "3"

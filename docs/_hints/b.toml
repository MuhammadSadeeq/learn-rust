[[quest]]
name = "memory1"
hint = """
1. Size means bytes on the stack. Heap contents don't count. Start with the types you know from the chapter 05 table, then reason about the rest.
2. A reference or a Box is one pointer, 8 bytes on a 64-bit machine. A String or a Vec is three words. A &str is a pointer and a length.
3. An i32 must start at a multiple of 4, so (i32, u8) rounds up to 8. A Box can't be null, so Option<Box<i32>> can use the null pointer for None and needs no extra tag.
"""

[[quest]]
name = "memory2"
hint = """
1. with_capacity(n) reserves room for n bytes without putting any text in the String. First work out the exact byte count of the finished line.
2. needed_capacity adds the length of every field, then one comma for each gap between two neighbors. fields.len().saturating_sub(1) counts the gaps, and it is 0 for an empty list.
3. In grow_report, remember the capacity before the loop. After each push, compare the new capacity with the remembered one, and record it only when it changed.
"""

[[quest]]
name = "move2"
hint = """
1. The function owns the String it receives, so it can change it in place. It doesn't need to build a new one.
2. String has push_str, which appends a &str to the end of the String.
3. Call push_str with the signature text, then end the function with text and no semicolon, so ownership goes back to the caller.
"""

[[quest]]
name = "move3"
hint = """
1. The compiler reports E0382 twice. Each message names a variable that was used after a line that moved it.
2. For each one you can move the use above the line that moves the value, or borrow the value with & where the function only reads it.
3. describe takes &name, so call it before `let archived = name;`. For the Vec, iter() only borrows it, so compute the total before `let graded = scores;`.
"""

[[quest]]
name = "move4"
hint = """
1. Read the error on the words.len() line. The loop before it took the Vec, so the Vec is gone when that line runs.
2. A for loop over a Vec takes it by value. A for loop over a reference borrows it instead.
3. Change the loop header to `for w in &words`. Then w is a &String, and w.len() works the same way.
"""

[[quest]]
name = "borrow1"
hint = """
1. Look at what each function does with its argument. If it only reads it, the parameter can be a borrow.
2. &str accepts both a &String and a literal. &[i32] accepts both a &Vec<i32> and an array. A String parameter takes the value away from the caller.
3. Change the two parameter types to &str and &[i32]. Then call word_count(&text) and sum(&scores) in main.
"""

[[quest]]
name = "borrow2"
hint = """
1. A &mut parameter lets the function change the caller's value. Assign through it with *price = ..., where the * reaches the number the reference points to.
2. Iterating a &mut [u32] with `for price in prices` gives you &mut u32 values. Do the multiplication in u64, because a price of one billion times 110 doesn't fit in u32. Integer division rounds the tax down.
3. For capitalize_first, s.chars().next() gives the first character. Replace exactly its bytes with s.replace_range, using len_utf8 to find how many bytes it takes.
"""

[[quest]]
name = "borrow3"
hint = """
1. Each error names a borrow that is still alive. E0502 is the shared reference that push_and_report keeps while it pushes. E0499 is two &mut references to elements of the same Vec.
2. v.first() returns an Option<&i32>, which is a reference into the Vec. Calling copied() turns it into an Option<i32>, a plain value that doesn't borrow the Vec.
3. For swap_first_two, one &mut borrow of the whole slice is allowed, and slices have a method that swaps two elements. Use that method.
"""

[[quest]]
name = "borrow4"
hint = """
1. E0515 means the returned reference would point at greeting, which is dropped when make_greeting returns.
2. A function can return an owned value. The caller then owns it, and it lives as long as the caller needs it.
3. Change the return type to String, and return the format! result without the &.
"""

[[quest]]
name = "strings1"
hint = """
1. to_uppercase returns a new String. starts_with only checks a prefix and needs no allocation.
2. &str parameters accept both a &String and a literal. A String is only needed when a function returns new text.
3. Slices of &str have join(" ") for the words. For the prefix, s.starts_with("Hello") is case sensitive, which is what the tests expect.
"""

[[quest]]
name = "strings2"
hint = """
1. trim_matches(' ') removes spaces at both ends. Then find(' ') returns the byte index of the first space, and &s[..i] is a slice up to it.
2. rfind(' ') finds the last space. The last word starts one byte after that space. If there is no space, the last word starts at 0.
3. Apply map_or(0, |i| i + 1) to the result of rfind, then slice from that position to the end.
"""

[[quest]]
name = "strings3"
hint = """
1. len() counts bytes. chars() walks whole characters. "héllo" is 6 bytes and 5 characters, so count characters with chars().
2. char_indices() yields (byte position, char) pairs. nth(max) is the first character you drop, and its byte position is where the prefix must end.
3. reverse_chars can collect s.chars().rev() into a String. truncate_chars can match on char_indices().nth(max), slice up to the position it gives, and return s when it gives None.
"""

[[quest]]
name = "strings4"
hint = """
1. split_whitespace() splits on any run of spaces. Capitalize each word, then join the results with " ".
2. to_uppercase() on one char returns an iterator, because one char can become several. Chain the rest of the word onto it and collect into a String.
3. For slugify, loop over the chars. Keep each ASCII letter or digit, lowercased. For anything else, push one '-' unless the last char already is one. At the end, trim '-' from both ends.
"""

[[quest]]
name = "boss2_text_stats"
hint = """
1. Start with words(). It yields &str slices of the text, so each function can count, measure or compare words without copying them.
2. For longest_word, reduce keeps the earlier word on a tie if you replace the best only when the new word is strictly longer. For most_frequent, count with a HashMap<&str, usize> and entry(word).or_insert(0).
3. In most_frequent, max_by can compare the counts first, then compare the words in reverse with b.cmp(a), so the alphabetically first word wins ties. In average_word_len, one fold can collect the total characters and the word count together.
"""

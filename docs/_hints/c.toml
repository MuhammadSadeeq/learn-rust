[[quest]]
name = "structs1"
hint = """
1. rustc names the struct and the field in every error. Start with the first error, which says what a struct literal is missing.
2. A tuple struct has no field names. Its fields are read as p.0 and p.1, not p.x and p.y.
3. A new account starts out active, so the struct literal in new_user needs a value for active. In deactivate, the field is a bool, so a number will not do.
"""

[[quest]]
name = "structs2"
hint = """
1. Read each signature. new and square have no self, so they are called as Rect::new and Rect::square. The other methods take &self or &mut self.
2. area multiplies the two fields. scale changes the fields, so it needs &mut self. Assign with self.w *= k and the same for h.
3. can_hold needs both comparisons to be true at once: self.w >= other.w && self.h >= other.h. square can call new with the size twice.
"""

[[quest]]
name = "structs3"
hint = """
1. The derive line is already done: Debug, Clone and PartialEq. Default is the one you write by hand, because the app wants 14 and derive would give 0.
2. In default, return a Settings literal with the three values from the header. String::from("light") makes an owned String.
3. In with_theme, write only theme in the literal, then ..*base to copy the other fields from the original. Both of those fields are Copy, so nothing is cloned.
"""

[[quest]]
name = "enums1"
hint = """
1. Write one match per function, with one arm for each variant. Name the fields in the pattern, as in Notification::Email { to, subject }.
2. Build the text with format!, for example format!("Push: {title}"). Silent gives String::new().
3. channel does not need the field values, so the patterns can skip them with .. or _, as in Notification::Email { .. } => "email".
"""

[[quest]]
name = "enums2"
hint = """
1. next is a match on s with one arm per variant. Return Some with the following status, or None where there is no next step.
2. cancel can put the cancellable variants in one arm with |. Shipped and Delivered each get their own arm and message.
3. Put Cancelled in the same arm as Pending and Paid, so cancelling a cancelled order is Ok. Leave out a _ arm so the compiler checks every variant.
"""

[[quest]]
name = "option1"
hint = """
1. find_user: iter() and find() give you the matching tuple inside an Option. Then map gets the name, and as_str() borrows it as a &str.
2. safe_divide: look for an integer method that returns an Option instead of panicking, such as checked_div.
3. first_even: iterate with copied(), then find the first value where n % 2 == 0.
"""

[[quest]]
name = "option2"
hint = """
1. Each unwrap() panics on None, or on a bad parse. Replace it with a way to handle the missing case: if let, let else or unwrap_or.
2. parse_port: parse() returns a Result. .ok() turns it into an Option, and unwrap_or(8080) gives the fallback.
3. initials: let Some(name) = name else { return String::new(); } handles the None case first. The iterator chain after it can stay as it is.
"""

[[quest]]
name = "errors1"
hint = """
1. A function that returns a Result should return Err for bad input, not call panic! or expect(). Each message in the header is one Err value.
2. Use match on s.parse::<u32>(). Put the error arm first, then a guard arm for numbers above 150.
3. The guard looks like Ok(n) if n > 150 => Err(String::from("too old")). The last arm is Ok(n) for a valid age.
"""

[[quest]]
name = "errors2"
hint = """
1. unwrap() turns an error into a panic. These functions already return a Result, so the error can travel up to the caller instead.
2. Put ? after a call that returns a Result. On Err it returns that error from the function at once. On Ok it gives you the value.
3. In sum_csv, total += field.parse::<i64>()?; does it. In parse_point, each of the two parses gets its own ? inside the Ok(...).
"""

[[quest]]
name = "errors3"
hint = """
1. Display is one match on self with an arm for each variant. write!(f, "missing key: {key}") writes the text into the formatter.
2. In get_port, find the "port" pair with pairs.iter().find(...). If there is none, return Err(ConfigError::Missing(...)) with the key name.
3. Parse the value with parse::<u16>(), then map_err it into ConfigError::Invalid { key, value }. The value field holds the raw text.
"""

[[quest]]
name = "errors4"
hint = """
1. The compiler says ? cannot convert a ParseIntError into an AppError. Teach it how with impl From<ParseIntError> for AppError.
2. In the from function, wrap the error in the Parse variant: AppError::Parse(e).
3. Display follows the errors3 pattern: a match on self, then write! for each variant, using the messages from the header.
"""
